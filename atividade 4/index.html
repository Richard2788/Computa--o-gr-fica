<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Primeira Cena 3D</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #000; }
    canvas { display: block; }
  </style>
  <!-- Importando a biblioteca Three.js via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<script>
  // 1. CRIANDO A CENA
  const scene = new THREE.Scene();

  // 2. CONFIGURANDO A CÂMERA (Campo de visão, Proporção, Near, Far)
  const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  );
  camera.position.z = 5; // Afasta a câmera no eixo Z para ver o objeto

  // 3. CRIANDO O RENDERIZADOR
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // 4. CRIANDO O OBJETO (Geometria + Material = Mesh)
  const geometry = new THREE.BoxGeometry(2, 2, 2); // Cubo de 2x2x2
  const material = new THREE.MeshBasicMaterial({ color: 0x38bdf8, wireframe: true });
  const cube = new THREE.Mesh(geometry, material);
  scene.add(cube); // Adiciona o cubo à cena

  // 5. LOOP DE ANIMAÇÃO (Game/Render Loop)
  function animate() {
    requestAnimationFrame(animate);

    // Rotaciona o cubo nos eixos X e Y
    cube.rotation.x += 0.01;
    cube.rotation.y += 0.01;

    // Renderiza a cena a partir da perspectiva da câmera
    renderer.render(scene, camera);
  }

  animate(); // Inicia o loop
</script>

</body>
</html>
