<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minha Primeira Cena 3D</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #000;
      }
      canvas {
        display: block;
      }
    </style>
    <!-- Importando a biblioteca Three.js via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  </head>
  <body>
    <script>
      // 1. CRIANDO A CENA
      const scene = new THREE.Scene();

      // Criando o renderizador
      const renderer = new THREE.WebGLRenderer({ antialias: true });

      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);
      
      const light = new THREE.DirectionalLight(0xffffff, 1.5);
      light.position.set(5, 5, 5);
      scene.add(light);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
      scene.add(ambientLight);

      // 2. CONFIGURANDO A CÂMERA (Campo de visão, Proporção, Near, Far)
      const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000,
      );
      camera.position.z = 5; // Afasta a câmera no eixo Z para ver o objeto

      // 1. Criar as geometrias
      const geometria1 = new THREE.DodecahedronGeometry(1, 1, 1);
      const geometria2 = new THREE.TorusGeometry(0.8, 0.3, 16, 100);

      // 2. Definir materiais e cores
      const material1 = new THREE.MeshStandardMaterial({
        color: 0x0066ff,
      });

      const material2 = new THREE.MeshStandardMaterial({
        color: 0xff6600,
      });

      // 3. Construir os objetos
      const objeto1 = new THREE.Mesh(geometria1, material1);
      const objeto2 = new THREE.Mesh(geometria2, material2);

      // 4. Posicionar os objetos na cena
      objeto1.position.x = -2;
      objeto2.position.x = 2;

      // 5. Adicionar os objetos à cena
      scene.add(objeto1);
      scene.add(objeto2);

      // 6. Criar a animação
      function animate() {
        requestAnimationFrame(animate);

        objeto1.rotation.y += 0.02;
        objeto2.rotation.x -= 0.03;

        renderer.render(scene, camera);
      }

      animate();
    </script>
  </body>
</html>
